<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BKS</title>
<link rel="stylesheet" href="pixfont.css">
<style>
  /* BKS — clean studio launcher: a game library on the left, the selected game's page on the right */
  :root { --bg: #0d0f14; --side: #11141b; --panel: #171b24; --panel2: #1f2430; --line: #262c39; --text: #e9ecf2; --muted: #8a93a6; --dim: #5d6576;
    --accent: #e5413a; --accent2: #ff6a52; --gold: #f2b33d; --green: #4cc38a;
    --ui: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; --game: 'BS Blade', monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; font: 400 13px/1.45 var(--ui); }
  button { font-family: var(--ui); }
  /* title bar */
  .top { position: absolute; inset: 0 0 auto 0; height: 36px; display: flex; align-items: center; gap: 10px; padding-left: 14px; background: var(--side); border-bottom: 1px solid var(--line); -webkit-app-region: drag; z-index: 5; }
  .top .ic { width: 20px; height: 20px; image-rendering: pixelated; }
  .top .t { font-weight: 700; letter-spacing: .14em; font-size: 12px; }
  .top .sp { flex: 1; }
  .top button { -webkit-app-region: no-drag; width: 46px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; }
  .top button:hover { background: var(--panel2); color: var(--text); } .top button.x:hover { background: #c42b1c; color: #fff; }
  /* library sidebar */
  .lib { position: absolute; left: 0; top: 36px; bottom: 0; width: 236px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px 12px; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 18px; }
  .brand img { width: 52px; height: 52px; image-rendering: pixelated; }
  .brand b { display: block; font-size: 20px; letter-spacing: .2em; font-weight: 800; } .brand span { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  .lib h3 { margin: 6px 8px 6px; font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
  .game { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; border: 0; background: none; color: var(--text); text-align: left; cursor: pointer; width: 100%; }
  .game:hover { background: var(--panel); } .game.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .game .th { width: 40px; height: 40px; border-radius: 6px; flex: none; background: #222 center/cover; image-rendering: pixelated; }
  .game b { display: block; font-size: 13px; font-weight: 600; } .game span { font-size: 11px; color: var(--muted); }
  .game.soon b { color: var(--muted); } .game .tag { margin-left: auto; font-size: 9px; letter-spacing: .1em; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  .lib .foot { padding: 8px; color: var(--dim); font-size: 11px; display: flex; justify-content: space-between; }
  /* game page */
  .page { position: absolute; left: 236px; right: 0; top: 36px; bottom: 0; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .banner { position: relative; overflow: hidden; background: #0a0b10; }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 45%; image-rendering: pixelated; opacity: 0; transition: opacity 1.1s; }
  .banner img.on { opacity: 1; }
  .banner img.fit { object-fit: contain; object-position: right center; -webkit-mask-image: linear-gradient(90deg, transparent 38%, #000 58%); mask-image: linear-gradient(90deg, transparent 38%, #000 58%); }   /* key art: whole picture, every fighter in view */
  .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,15,20,.92) 0, rgba(13,15,20,.55) 36%, rgba(13,15,20,0) 62%), linear-gradient(0deg, var(--bg) 0, rgba(13,15,20,0) 42%); }
  .cap { position: absolute; left: 36px; bottom: 26px; z-index: 2; max-width: 46%; }
  .cap .gl { font: 400 54px/1 var(--game); letter-spacing: .04em; color: #fff; text-shadow: 0 3px 0 #000; }
  .cap .gs { color: var(--gold); font-size: 12px; letter-spacing: .22em; font-weight: 600; margin-top: 8px; }
  .cap .who { margin-top: 14px; color: var(--muted); font-size: 12px; } .cap .who b { color: var(--text); font-weight: 600; }
  .pips { position: absolute; right: 24px; bottom: 26px; display: flex; gap: 6px; z-index: 2; } .pips i { width: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); } .pips i.on { background: var(--accent); }
  .soonart { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 70% 30%, #2a1730, #0b0c11 70%); }
  .soonart div { text-align: center; } .soonart b { display: block; font: 400 46px/1 var(--game); letter-spacing: .05em; } .soonart span { color: var(--muted); letter-spacing: .3em; font-size: 12px; }
  .below { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 0 24px 20px; height: 330px; }
  .action { grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .play { flex: none; width: 200px; height: 52px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .12em; cursor: pointer; transition: background .15s, transform .1s; outline: none; }
  .play:hover:not(:disabled), .play:focus-visible:not(:disabled) { background: var(--accent2); } .play:active:not(:disabled) { transform: scale(.98); }
  .play:disabled { background: var(--panel2); color: var(--dim); cursor: default; }
  .status { flex: 1; min-width: 0; }
  .status .s { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .s.err { color: var(--gold); } .status .s.ok::before { content: '● '; color: var(--green); }
  .status .d { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { height: 6px; margin-top: 8px; background: var(--bg); border-radius: 3px; overflow: hidden; visibility: hidden; } .prog.on { visibility: visible; }
  .prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .ver { color: var(--dim); font-size: 11px; text-align: right; } .ver b { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { font-size: 10px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
  .notes { overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .note { margin-bottom: 14px; } .note .h { color: var(--text); font-weight: 600; font-size: 12px; margin-bottom: 4px; } .note .h span { color: var(--dim); font-weight: 400; }
  .note ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; } .note li { margin: 3px 0; }
  .empty { color: var(--muted); font-size: 12px; }
  .link { background: none; border: 0; color: var(--accent2); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
  /* friends (built by social.js) */
  .social { gap: 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .social h2 { margin-bottom: 2px; }
  .social input { width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: 400 12px/1 var(--ui); outline: none; }
  .social input:focus { border-color: var(--accent); }
  .social button { padding: 7px 10px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: .04em; }
  .social button:hover:not(:disabled) { border-color: var(--muted); } .social button:disabled { opacity: .4; cursor: default; }
  .social button.go { background: var(--accent); border-color: var(--accent); color: #fff; } .social button.go:hover:not(:disabled) { background: var(--accent2); }
  .social button.sm { padding: 4px 8px; font-size: 10px; }
  .social .link { padding: 0; border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 10px; }
  .tabs { display: flex; gap: 6px; } .tabs button { flex: 1; } .tabs button.on { border-color: var(--accent); color: #fff; }
  .authf, .addf { display: grid; gap: 6px; } .addf { grid-template-columns: 1fr auto; }
  .social .err { margin: 0; color: var(--gold); font-size: 11px; } .social .ok { margin: 0; color: var(--green); font-size: 11px; } .social .hint { margin: 0; color: var(--muted); font-size: 11px; }
  .me, .fr { display: flex; align-items: center; gap: 8px; font-size: 12px; min-height: 28px; }
  .me span:last-child, .fr .act { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr b, .me b { font-weight: 600; } .fr.off b { color: var(--muted); } .fr .sp { flex: 1; } .fr button + button { margin-left: 4px; }
  .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); } .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sec { color: var(--dim); font-size: 10px; letter-spacing: .12em; margin-top: 4px; font-weight: 600; } .list { display: grid; gap: 2px; }
  .inv { border: 1px solid var(--accent); border-radius: 8px; background: rgba(229,65,58,.1); padding: 8px 10px; font-size: 12px; animation: pulse 1.2s infinite alternate; }
  .inv b { color: #fff; } .inv .row { display: flex; gap: 6px; margin-top: 6px; }
  @keyframes pulse { from { box-shadow: 0 0 0 rgba(229,65,58,0); } to { box-shadow: 0 0 14px rgba(229,65,58,.4); } }
  .hide { display: none !important; }
  body { animation: fadein .35s ease-out; } @keyframes fadein { from { opacity: 0; } }
  .banner img.on { animation: drift 9s ease-out forwards; } @keyframes drift { from { transform: scale(1.06); } to { transform: scale(1); } }
  .play { position: relative; overflow: hidden; } .play span { position: relative; z-index: 1; }
  .play .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(229,65,58,.55); transition: width .2s; }
  .more { position: relative; } .more > button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
  .more > button:hover { color: var(--text); border-color: var(--muted); }
  .menu { position: absolute; right: 0; bottom: 42px; min-width: 210px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 9; }
  .menu button { display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: 6px; background: none; color: var(--text); font-size: 12px; cursor: pointer; }
  .menu button:hover { background: var(--panel); } .menu small { display: block; color: var(--dim); font-size: 10px; }
  .menu .mh { padding: 6px 10px 4px; font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
  .lset { position: relative; margin-top: auto; }
  .lset > button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; color: var(--dim); font-size: 11px; cursor: pointer; text-align: left; }
  .lset > button:hover, .lset > button[aria-expanded="true"] { background: var(--panel); color: var(--text); }
  .lset > button .gear { font-size: 14px; } .lset > button .sp { flex: 1; }
  .lset .menu { left: 0; right: auto; bottom: 40px; min-width: 230px; }
  .soonart small { display: block; margin-top: 14px; color: var(--dim); font-size: 12px; letter-spacing: .06em; }
  @media (max-width: 1000px) { .below { grid-template-columns: minmax(0, 1fr) 270px; } .cap .gl { font-size: 42px; } }
</style></head>
<body>
  <div class="top"><img src="bks.png" alt="" class="ic"><span class="t">BKS</span><span class="sp"></span><button type="button" id="lfsB" aria-label="Full screen" title="Full screen (F11)">⛶</button><button type="button" id="min" aria-label="Minimize">—</button><button type="button" class="x" id="close" aria-label="Close">✕</button></div>
  <nav class="lib">
    <div class="brand"><img src="bks.png" alt="BKS"><div><b>BKS</b><span>GAMES</span></div></div>
    <h3>LIBRARY</h3>
    <button type="button" class="game on" data-g="bsas"><span class="th" style="background-image:url(bsas_icon.png);background-color:transparent;background-size:contain;background-repeat:no-repeat"></span><div><b>B.S.A.S</b><span>Fighting</span></div></button>
    <button type="button" class="game soon" data-g="crown"><span class="th" style="background:#241628"></span><div><b>The Hollow Crown</b><span>Roguelike</span></div><span class="tag">SOON</span></button>
    <div class="lset"><button type="button" id="lsetB" aria-haspopup="true" aria-expanded="false" title="BKS launcher settings"><span class="gear">⚙</span><span>BKS Launcher</span><span class="sp"></span><span id="lver"></span></button>
      <div class="menu hide" id="lmenu" role="menu">
        <div class="mh">BKS LAUNCHER</div>
        <button type="button" id="lUpd" role="menuitem">Check for launcher updates<small id="lUpdS">Get the newest BKS</small></button>
        <button type="button" id="lFull" role="menuitemcheckbox" aria-checked="true">Full screen: <b id="lFullV">ON</b><small>The launcher fills the screen · F11 or Alt+Enter switches</small></button>
        <button type="button" id="mShortcut" role="menuitem">Create desktop shortcut<small>Put a BKS icon on your desktop</small></button>
      </div></div>
  </nav>
  <main class="page">
    <section class="banner" id="banner">
      <div id="hero"></div>
      <div class="cap" id="cap"><div class="gl">B.S.A.S</div><div class="gs">BLACK SOULS ALL STAR</div><div class="who"><b id="whoN"></b><span id="whoDot" class="hide"> · </span><span id="whoS">FOUR FIGHTERS · 14 STAGES</span></div></div>
      <div class="pips" id="pips"></div>
      <div class="soonart hide" id="soon"><div><b>THE HOLLOW CROWN</b><span>COMING SOON</span><small>A roguelike from BKS. It will appear right here and install with one click.</small></div></div>
    </section>
    <section class="below">
      <div class="action">
        <button type="button" class="play" id="play" disabled><i class="fill" id="pfill"></i><span id="playT">WAIT</span></button>
        <div class="status"><div class="s" id="st">Starting…</div><div class="d" id="det"></div><div class="prog" id="prog"><i id="pbar"></i></div></div>
        <div class="ver">INSTALLED<b id="ver">—</b></div>
        <div class="more"><button type="button" id="moreB" aria-label="B.S.A.S options" title="B.S.A.S options" aria-haspopup="true">⋯</button>
          <div class="menu hide" id="menu" role="menu">
            <div class="mh">B.S.A.S</div>
            <button type="button" id="mCheck" role="menuitem">Check for game updates<small>Look for a new B.S.A.S version now</small></button>
            <button type="button" id="mRepair" role="menuitem">Repair game files<small>Re-check every file and fix damaged ones</small></button>
            <button type="button" id="mFull" role="menuitemcheckbox" aria-checked="true">Full screen: <b id="mFullV">ON</b><small>B.S.A.S opens full screen · F11 or Alt+Enter switches</small></button>
            <button type="button" id="mFolder" role="menuitem">Open game folder<small>Where B.S.A.S is installed</small></button>
          </div></div>
      </div>
      <div class="card pn"><h2>WHAT'S NEW <small id="latest"></small></h2><div class="notes" id="notes"><p class="empty">Checking for news…</p></div></div>
      <div class="card social" id="social"></div>
    </section>
  </main>
<script src="cloud.js"></script>
<script src="social.js"></script>
<script>
'use strict';
const L = window.launcher, $ = id => document.getElementById(id);
// banner slides: the two PixelLab key arts first, then a fighter on his stage
const ROSTER = [['key1.png', '', 'FOUR FIGHTERS · 14 STAGES'], ['hero0.png', 'YOSHIDA', 'THE SHADOW NINJA'], ['hero1.png', 'Y4NK', 'THE BRAWLER'], ['hero2.png', 'BIG RUSTY', 'THE SWAMP KING'], ['hero3.png', 'BLITZY', 'THE IRON GUNSLINGER']];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';

// ----- the roster takes turns, like the game's title screen -----
let heroI = 0;
ROSTER.forEach((r, i) => { const im = new Image(); im.src = r[0]; im.alt = ''; if (/^key/.test(r[0])) im.classList.add('fit'); if (!i) im.classList.add('on'); $('hero').appendChild(im); $('pips').insertAdjacentHTML('beforeend', `<i class="${i ? '' : 'on'}"></i>`); });
setInterval(() => {
  if (document.hidden || state === 'running' || $('hero').classList.contains('hide')) return;   // no work while nobody is looking
  heroI = (heroI + 1) % ROSTER.length;
  document.querySelectorAll('.hero img').forEach((im, i) => im.classList.toggle('on', i === heroI));
  document.querySelectorAll('.pips i').forEach((p, i) => p.classList.toggle('on', i === heroI));
  $('whoN').textContent = ROSTER[heroI][1]; $('whoS').textContent = ROSTER[heroI][2]; $('whoDot').classList.toggle('hide', !ROSTER[heroI][1]);
}, 5200);

// ----- status -----
let state = 'start', installed = '0', canPlay = false;
function show(s, d, kind) { const e = $('st'); e.textContent = s; e.className = 's' + (kind ? ' ' + kind : ''); $('det').innerHTML = d || ''; }
function button(label, enabled) { $('playT').textContent = label; $('play').disabled = !enabled; canPlay = enabled && label === 'PLAY'; if (enabled && !/INPUT/.test(document.activeElement && document.activeElement.tagName)) $('play').focus(); }
function progress(on, k) { $('prog').classList.toggle('on', on); const w = on ? (100 * (k || 0)).toFixed(1) + '%' : '0'; $('pbar').style.width = w; $('pfill').style.width = w; if (on) $('playT').textContent = Math.floor(100 * (k || 0)) + '%'; }
// numbers get a v (v2.0); a name like BETA shows as it is
const V = v => (/^\d/.test(String(v)) ? 'v' + v : String(v || '').toUpperCase());
function renderNotes(notes) {
  if (!notes || !notes.length) { $('notes').innerHTML = '<p class="empty">No patch notes yet.</p>'; return; }
  $('notes').innerHTML = notes.slice(0, 12).map(n => `<div class="note"><div class="h">${esc(V(n.v))} <span>· ${esc(n.date || '')}</span></div><ul>${(n.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
  $('latest').textContent = 'LATEST ' + V(notes[0].v);
}

async function check(auto) {
  state = 'checking'; button('WAIT', false); progress(false); show('Checking for updates…');
  let info;
  try { info = await L.check(); }
  catch (e) {
    state = 'offline'; button('PLAY', true);
    show(`Offline — playing installed version ${V(installed)}`, 'Could not reach the update server. <button class="link" id="retry">Try again</button>', 'err');
    $('retry').onclick = () => check(); if ($('notes').querySelector('.empty')) $('notes').innerHTML = '<p class="empty">Patch notes show up when you are online.</p>';
    return;
  }
  renderNotes(info.notes);
  if (info.needLauncher) {
    show('A new launcher is needed for the latest version', `<button class="link" id="getl">Download the new launcher</button> · you can still play ${V(installed)}`, 'err');
    $('getl').onclick = () => L.open(info.launcherUrl); state = 'ready'; button('PLAY', true); return;
  }
  if (!info.files) { state = 'ready'; button('PLAY', true); show(`Up to date · ${V(info.version)}`, 'Press PLAY or Enter. Controllers work too.', 'ok'); return; }
  state = 'updating'; button('UPDATING', false); progress(true, 0);
  show(`Updating to ${V(info.version)}…`, `${info.files} file${info.files === 1 ? '' : 's'} · ${mb(info.bytes)}`);
  try {
    await L.update();
    const i = await L.info(); installed = i.installed; $('ver').textContent = V(installed);
    progress(false); state = 'ready'; button('PLAY', true); show(`Up to date · ${V(installed)}`, 'Update installed. Press PLAY.', 'ok');
  } catch (e) {
    progress(false); state = 'error'; button('PLAY', true);
    show('The update did not finish', `Your current version ${V(installed)} still works. <button class="link" id="retry">Try again</button>`, 'err');
    $('retry').onclick = () => check();
  }
}
L.onProgress(p => {
  if (state !== 'updating') return; const k = p.bytes ? p.now / p.bytes : 1; progress(true, k);
  const sp = p.ms > 600 ? p.now / (p.ms / 1000) : 0, left = sp ? (p.bytes - p.now) / sp : 0;
  $('det').textContent = `${mb(p.now)} / ${mb(p.bytes)}${sp ? ` · ${mb(sp)}/s · ${left < 60 ? Math.ceil(left) + ' s' : Math.ceil(left / 60) + ' min'} left` : ''}`;
});
L.onGame(g => { if (g.running) { state = 'running'; button('RUNNING', false); show('Game running'); } else check(); });

$('play').onclick = () => { if (canPlay && $('soon').classList.contains('hide')) { button('STARTING', false); L.play(); } };   // only from the B.S.A.S page
$('min').onclick = () => L.win('min'); $('close').onclick = () => L.win('close');
addEventListener('keydown', e => { if (/INPUT|BUTTON/.test(document.activeElement && document.activeElement.tagName) && document.activeElement !== $('play')) return; if ((e.key === 'Enter' || e.key === ' ') && canPlay) { e.preventDefault(); $('play').click(); } });
// controller: ✕ / A starts the game
let padPrev = false;
// controller: polled 20 times a second only while the launcher is on screen (it sleeps while you play)
(function poll() {
  if (!document.hidden && state !== 'running') { const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; const a = pads.some(p => p.buttons[0] && p.buttons[0].pressed || p.buttons[9] && p.buttons[9].pressed); if (a && !padPrev && canPlay && document.hasFocus()) $('play').click(); padPrev = a; }
  setTimeout(poll, 50);
})();

if (L.onFirewall) L.onFirewall(st => {
  const msg = { asking: 'Windows will ask once to let online play through the firewall — click Yes.', ok: 'Online play is allowed through Windows Firewall.', declined: 'Firewall permission skipped — Windows may ask when you play online.' }[st];
  if (msg && (state === 'ready' || state === 'offline' || st === 'asking')) $('det').textContent = msg;
});
if (L.onLauncherUpdated) L.onLauncherUpdated(() => { if (state === 'ready' || state === 'offline') $('det').textContent = state === 'running' ? 'BKS updated itself. The new version starts next time you open it.' : 'BKS updated itself. Restarting into the new version…'; });
L.info().then(i => { installed = i.installed; $('ver').textContent = V(installed); check(true); });
setInterval(() => { if (state === 'ready' || state === 'offline') check(); }, 30 * 60 * 1000);

// ----- BKS library: B.S.A.S is playable, the next game shows as coming soon -----
document.querySelectorAll('.game').forEach(b => b.onclick = () => {
  document.querySelectorAll('.game').forEach(x => x.classList.toggle('on', x === b));
  const soon = b.dataset.g !== 'bsas';
  $('soon').classList.toggle('hide', !soon); $('cap').classList.toggle('hide', soon); $('pips').classList.toggle('hide', soon); $('hero').classList.toggle('hide', soon);
  document.querySelector('.below').classList.toggle('hide', soon);
});
L.info().then(i => { $('lver').textContent = 'v' + i.launcher; });
// ----- more menu: check, repair, open folder -----
// two separate menus: ⋯ next to PLAY is the game's, ⚙ in the sidebar is the launcher's
const menu = $('menu'), lmenu = $('lmenu');
const closeMenu = () => { menu.classList.add('hide'); lmenu.classList.add('hide'); $('lsetB').setAttribute('aria-expanded', 'false'); };
$('moreB').onclick = e => { e.stopPropagation(); const open = menu.classList.contains('hide'); closeMenu(); if (open) menu.classList.remove('hide'); };
$('lsetB').onclick = e => { e.stopPropagation(); const open = lmenu.classList.contains('hide'); closeMenu(); if (open) { lmenu.classList.remove('hide'); $('lsetB').setAttribute('aria-expanded', 'true'); } };
addEventListener('click', e => { if (!menu.contains(e.target) && !lmenu.contains(e.target)) closeMenu(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
$('mCheck').onclick = () => { closeMenu(); if (state !== 'updating' && state !== 'running') check(); };
let fullOn = true;
const showFull = on => { fullOn = !!on; $('mFullV').textContent = fullOn ? 'ON' : 'OFF'; $('mFull').setAttribute('aria-checked', String(fullOn)); };
if (L.getfs) { L.getfs().then(showFull); L.onFs && L.onFs(showFull); } else $('mFull').classList.add('hide');
$('mFull').onclick = async e => { e.stopPropagation(); showFull(await L.setfs(!fullOn)); };
$('mFolder').onclick = () => { closeMenu(); L.folder && L.folder(); };
if (!L.shortcut || !/Windows/.test(navigator.userAgent)) $('mShortcut').classList.add('hide');
if (!L.lcheck) $('lUpd').classList.add('hide');
// launcher full screen (its own setting; the game's is in the ⋯ menu)
let lFullOn = false;
const showLFull = on => { lFullOn = !!on; $('lFullV').textContent = lFullOn ? 'ON' : 'OFF'; $('lFull').setAttribute('aria-checked', String(lFullOn)); $('lfsB').textContent = lFullOn ? '🗗' : '⛶'; $('lfsB').title = lFullOn ? 'Exit full screen (F11)' : 'Full screen (F11)'; };
if (L.getlfs) { L.getlfs().then(showLFull); L.onLfs && L.onLfs(showLFull); } else { $('lFull').classList.add('hide'); $('lfsB').classList.add('hide'); }
$('lFull').onclick = async e => { e.stopPropagation(); showLFull(await L.setlfs(!lFullOn)); };
$('lfsB').onclick = async () => showLFull(await L.setlfs(!lFullOn));
// launcher-menu results show inside the launcher menu itself, so they never mix with the game's status line
const shortS = $('mShortcut').querySelector('small');
$('mShortcut').onclick = async e => {
  e.stopPropagation(); let r = null; try { r = await L.shortcut(); } catch (err) {}
  shortS.textContent = r && r.ok ? (r.existed ? '✓ Shortcut refreshed on your desktop' : '✓ Shortcut added to your desktop') : 'Could not create the shortcut';
};
let lBusy = false;
$('lUpd').onclick = async e => {
  e.stopPropagation(); if (lBusy || !L.lcheck) return; lBusy = true; $('lUpdS').textContent = 'Checking…';
  try {
    const r = await L.lcheck();
    $('lUpdS').textContent = r.needRuntime ? 'A new installer is needed — opening download' : r.latest > r.version ? `Updated to v${r.latest} — restarting…` : `Up to date · v${r.version}`;
    if (r.needRuntime && r.url) L.open(r.url);
  } catch (err) { $('lUpdS').textContent = 'Could not reach the update server'; }
  lBusy = false;
};
$('mRepair').onclick = async () => {
  closeMenu(); if (state === 'updating' || state === 'running' || !L.verify) return;
  state = 'checking'; button('WAIT', false); show('Checking every game file…', 'This takes a few seconds.');
  try { const r = await L.verify(); show(r.bad ? `Found ${r.bad} damaged file${r.bad === 1 ? '' : 's'}, fixing…` : 'All files are fine', ''); } catch (e) {}
  check();
};
// ----- keyboard: up / down moves through the library -----
addEventListener('keydown', e => {
  if (/INPUT/.test(document.activeElement && document.activeElement.tagName) || !/^Arrow(Up|Down)$/.test(e.key)) return;
  const g = [...document.querySelectorAll('.game')], i = g.findIndex(b => b.classList.contains('on')), n = g[(i + (e.key === 'ArrowDown' ? 1 : g.length - 1)) % g.length];
  n.click(); e.preventDefault();
});

</script>
</body></html>
