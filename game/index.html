<style>
  :root { --ink: #0e0904; --paper: #f6ead2; --muted: #b9a27e; --gold: #f2b33d; --leaf: #7fbf4d; --bark: #3a200c; --f-display: 'BS Blade', monospace; --f-label: 'BS Edge', monospace; }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 0%, #1f2a14 0%, var(--ink) 70%); color: var(--paper); font: 400 14px/1.4 var(--f-label); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 12px 16px 20px; display: grid; gap: 10px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font: 400 34px/1 var(--f-display); color: var(--gold); letter-spacing: .04em; text-shadow: 3px 3px 0 #2a1607; }
  .note { color: var(--muted); font-size: 12px; } .sp { flex: 1; }
  button { font: 400 13px/1 var(--f-label); color: var(--paper); background: #3a200c; border: 2px solid #6b4423; padding: 9px 14px; cursor: pointer; letter-spacing: .06em; }
  button:hover { border-color: var(--gold); }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 3px solid #4a2c12; box-shadow: 0 0 0 2px #1a0f06, 0 0 40px rgba(0,0,0,.6); overflow: hidden; }
  #stage:fullscreen { width: 100vw; height: 100vh; border: 0; display: grid; place-items: center; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #stage:fullscreen canvas { width: min(100vw, 100vh * 16 / 9); height: auto; }
  #codebox { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -10%); display: none; }
  #codebox input { font: 400 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .3em; width: 9ch; text-align: center; padding: 8px; background: #f6e2b8; color: #3a200c; border: 3px solid #3a200c; }
</style></head>

      items.forEach(([, lb], i) => v.plankLabel(ctx, lb, VW / 2, py + 240 + i * 70, 240, 56, this.sel === i, 20));
    }
    if (this.status) { const words = this.status.split(' '), lines = ['']; for (const w of words) { const t = (lines[lines.length - 1] + ' ' + w).trim(); if (v.textW(t, 12, FS) > pw - 140 && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = t; } lines.forEach((l, j) => v.text(ctx, l, VW / 2, py + ph - 56 + j * 20, 12, '#6a2a0a', 'center', FS, '#f6e2b8', 2)); }
  }
  drawBadge(ctx, v) { v.text(ctx, `ONLINE · ${this.code}${this.role === 'guest' ? ' · GUEST' : ''}`, 24, VH - 20, 12, TC.paper, 'left', FS, '#1a0f06', 3); }
}
if (false) module.exports = { TCNet };
</script>
<script>/* TIMBERCLASH — browser glue: assets, keyboard + controllers, sound, the 60 Hz loop. */
'use strict';
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  PF.setCanvas(makeCanvas);
  const IMAGES = ['spr_blitzy', 'spr_rusty', 'spr_thyb', 'fx_hit_light', 'fx_hit_heavy', 'fx_block', 'fx_dust', 'fx_ko', 'bg_bayou', 'bg_canyon', 'bg_shrine', 'bg_frost', 'plat_bayou_main', 'plat_canyon_main', 'plat_shrine_main', 'plat_frost_main', 'plat_bayou_plat', 'plat_canyon_plat', 'plat_shrine_plat', 'plat_frost_plat', 'tc_arena', 'tc_hall', 'tc_panel', 'tc_button', 'tc_card', 'tc_trophy', 'tc_logo_plate', 'pfp_rusty', 'pfp_thyb', 'pfp_blitzy', 'splash_rusty', 'splash_thyb', 'splash_blitzy'];
  const img = {};
  // never let one slow or failed image hold the game on a black screen: give up on it after 8 s
  const load = n => new Promise(r => { const i = new Image(); const t = setTimeout(() => r(null), 8000); i.onload = () => { clearTimeout(t); r(i); }; i.onerror = () => { clearTimeout(t); r(null); }; i.src = n + '.png'; });
  // something on screen straight away while the art loads
  ctx.fillStyle = '#0b0812'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#f3e9dc'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center'; ctx.fillText('LOADING...', canvas.width / 2, canvas.height / 2);

  // ---------- sound ----------
  const sound = new Sound(); sound.setVolumes(7, 7, true, 0.8);
  // the whole soundtrack is composed and played live by the synth (audio.js): one track per map + menus
  const songs = {};
  const music = n => sound.music(n || null);
  setInterval(() => sound.tick(), 25);
  let unlocked = false;
  const env = { music, sfx: n => sound.sfx(n), say: t => sound.say(t), rumble: (slot, strong, weak, ms) => { const p = pads[slot]; const a = p && p.vibrationActuator; if (a && a.playEffect) a.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); } };
  const wake = () => { if (!unlocked) { unlocked = true; sound.resume(); } };
  addEventListener('pointerdown', wake); addEventListener('keydown', wake);

  // ---------- input ----------
  const keys = new Set(), latched = new Set();   // a tap shorter than one frame still counts for one frame
  addEventListener('keydown', e => { if (e.code === 'F2') { window.__hb = !window.__hb; e.preventDefault(); } });
  addEventListener('keydown', e => { keys.add(e.code); latched.add(e.code); if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault(); if (e.code === 'F11' || (e.altKey && e.code === 'Enter')) { e.preventDefault(); toggleFull(); } });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  // light / heavy / dodge / jump — up is aim, not jump (grab is still mapped but unused)
  const KB = [
    { l: 'KeyA', r: 'KeyD', u: 'KeyW', d: 'KeyS', a: 'KeyJ', b: 'KeyK', shield: 'KeyL', jump: 'Space', grab: 'KeyU', edge: 'KeyI', start: 'Enter', back: 'Escape' },
    { l: 'ArrowLeft', r: 'ArrowRight', u: 'ArrowUp', d: 'ArrowDown', a: 'Numpad1', b: 'Numpad2', shield: 'Numpad3', jump: 'Numpad0', grab: 'Numpad4', edge: 'Numpad5', start: 'NumpadEnter', back: 'Backspace' },
  ];
  const KB_ALT = { 0: { grab: 'KeyH', shield: 'ShiftLeft' }, 1: { a: 'Comma', b: 'Period', shield: 'Slash', jump: 'ShiftRight', grab: 'Semicolon' } };
  const has = c => keys.has(c) || latched.has(c);
  const fromKeys = i => { const s = blank(); for (const k of Object.keys(KB[i])) s[k] = has(KB[i][k]) || (KB_ALT[i] && KB_ALT[i][k] ? has(KB_ALT[i][k]) : false); return s; };
  let pads = [];
  const readPad = p => { const s = blank(); if (!p) return s; const B = i => !!(p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5)); const ax = p.axes[0] || 0, ay = p.axes[1] || 0, dz = 0.45;
    s.l = B(14) || ax < -dz; s.r = B(15) || ax > dz; s.u = B(12) || ay < -0.5; s.d = B(13) || ay > dz;
    s.jump = B(0); s.a = B(2); s.b = B(1); s.grab = B(3); s.shield = B(4) || B(6) || B(7); s.edge = B(5); s.start = B(9); s.back = B(8); return s; };
  const merge = (a, b) => { const s = {}; for (const k of BUTTONS) s[k] = a[k] || b[k]; return s; };
  // slot 0 = keyboard set 1 + the first controller, slot 1 = keyboard set 2 + the second controller, slots 3-4 = more controllers
  const inputs = [blank(), blank(), blank(), blank()];
  function readInputs() {
    pads = (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).filter(Boolean);
    const cur = [merge(fromKeys(0), readPad(pads[0])), merge(fromKeys(1), readPad(pads[1])), readPad(pads[2]), readPad(pads[3])];
    cur.forEach((c, i) => { const o = inputs[i]; for (const k of BUTTONS) o[k] = c[k]; }); latched.clear();
    return inputs;
  }

  // ---------- fullscreen + fit ----------
  const stage = document.getElementById('stage');
  const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen().catch(() => {}); };
  document.getElementById('full').onclick = toggleFull;

  // ---------- loop ----------
  Promise.all(IMAGES.map(load)).then(list => {
    IMAGES.forEach((n, i) => { if (list[i]) img[n] = list[i]; });
    const game = new Game(env), view = new View(game, img, makeCanvas);
    window.bsas = { game, view, sound, songs };
    if (typeof TCNet !== 'undefined') game.net = new TCNet(game, env);
    // fighter animation strips stream in after the menus are up; until one lands the stance sprite stands in
    if (typeof ANIM_META !== 'undefined') for (const ch of Object.keys(ANIM_META)) for (const mv of Object.keys(ANIM_META[ch])) { const i = new Image(); i.onload = () => { img[`a_${ch}_${mv}`] = i; }; i.src = `anim/${ch}/${mv}.png`; }
    music('title');
    let last = performance.now(), acc = 0;
    function frame(now) {
      const dt = Math.min(100, now - last); last = now; acc += dt;
      const inp = readInputs();
      let steps = 0;
      while (acc >= TICK && steps < 4) {
        game.update(TICK, inp); acc -= TICK; steps++;
      }
      if (acc > TICK * 4) acc = 0;
      try { view.draw(ctx, dt); } catch (e) { console.error(e); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
